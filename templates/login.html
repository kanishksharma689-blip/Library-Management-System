<!DOCTYPE html>
<html>

<head>

    <title>Library Management System</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .login-box {
            background: white;
            padding: 35px;
            width: 350px;

            border-radius: 12px;

            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #1e293b;
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;

            border: 1px solid #cbd5e1;
            border-radius: 6px;

            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;

            border: none;
            border-radius: 6px;

            background: #2563eb;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        .demo {
            margin-top: 20px;
            padding: 12px;

            background: #f8fafc;

            font-size: 13px;
        }

        .error {
            color: red;
            text-align: center;
        }

    </style>

</head>


<body>


<div class="login-box">

    <h1>📚</h1>

    <h1>
        Library Management System
    </h1>

    <h2>
        Login
    </h2>


    {% with messages = get_flashed_messages() %}

        {% for message in messages %}

            <p class="error">
                {{ message }}
            </p>

        {% endfor %}

    {% endwith %}


    <form method="POST" action="/">

        <label>
            Email
        </label>

        <input
            type="email"
            name="email"
            placeholder="Enter email"
            required>


        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required>


        <button type="submit">
            Login
        </button>

    </form>


    <div class="demo">

        <b>Librarian Demo</b>

        <br>

        Email: admin@gmail.com

        <br>

        Password: admin123

        <br><br>


        <b>Student Demo</b>

        <br>

        Email: student@gmail.com

        <br>

        Password: student123

    </div>


</div>


</body>

</html>
